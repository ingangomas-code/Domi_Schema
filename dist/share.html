<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#267454">
  <title>Schema compartido · Domi Schema Studio</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./share.css">
  <link rel="stylesheet" href="./canvas-cards.css">
</head>
<body>
  <header class="share-header"><div class="share-brand"><span class="share-mark" aria-hidden="true">⌘</span><div><small>DOMI SCHEMA STUDIO</small><h1 id="share-title">Schema compartido</h1></div></div><span id="share-meta" class="share-meta">Vista de solo lectura</span></header>
  <main id="share-stage" class="share-stage" aria-label="Esquema compartido de solo lectura">
    <div id="share-world" class="share-world" hidden><svg class="share-edges" width="1" height="1" overflow="visible"><defs><marker id="share-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#96aaa0" stroke-width="1.5"/></marker></defs><g id="share-edge-layer"></g></svg><div id="share-groups"></div><div id="share-nodes"></div><div id="share-cards"></div></div>
    <div id="share-state" class="share-state"><div><h2>Abriendo esquema…</h2><p>Comprobando el enlace público.</p></div></div>
    <div class="share-controls"><button id="share-zoom-out" aria-label="Alejar">−</button><span id="share-zoom">100%</span><button id="share-zoom-in" aria-label="Acercar">+</button><button id="share-fit">Ajustar</button></div>
  </main>
  <script src="./supabase-config.js"></script>
  <script src="./model.js"></script>
  <script src="./vendor/echarts.min.js"></script>
  <script src="./canvas-cards.js"></script>
  <script src="./share-view.js"></script>
</body>
</html>
